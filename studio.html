<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>De 0 a Clientes — Studio</title>
<meta name="description" content="De 0 a Clientes Studio: la unidad de construcción del ecosistema De 0 a Clientes. Productos digitales que están funcionando y experimentos que llegaron a validarse parcialmente.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230C0C0C'/%3E%3Ccircle cx='43' cy='43' r='15' fill='%23FFD400'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
  /* ================================================================
     DE 0 A CLIENTES — STUDIO · CSS MOBILE-FIRST
     Base = móvil (hasta 720px). Breakpoint:
       min-width 721px  → tablet / desktop
     ================================================================ */

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #0C0C0C;
    --ink-2: #5F5F5F;
    --ink-3: #9C9C9C;
    --yellow: #FFD400;
    --green: #12B76A;
    --white: #FFFFFF;
    --serif: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  html { font-size: 16px; scroll-behavior: smooth; }

  body {
    font-family: var(--serif);
    background: var(--white);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }

  a { color: inherit; text-decoration: none; }

  ::selection { background: var(--yellow); color: var(--ink); }

  :focus-visible {
    outline: 3px solid var(--yellow);
    outline-offset: 2px;
  }

  .container {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 22px;
  }

  .label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-2);
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }

  .label::before {
    content: '';
    width: 7px;
    height: 7px;
    background: var(--yellow);
    flex-shrink: 0;
  }

  .hl {
    background: linear-gradient(
      180deg,
      transparent 0 62%,
      var(--yellow) 62% 100%
    );
    display: inline;
    padding: 0 2px;
  }

  /* ── NAV ── */

  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    min-height: 62px;
    background: rgba(255,255,255,.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    padding: 10px 22px;
  }

  .nav-inner {
    max-width: 1080px;
    margin: 0 auto;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .wordmark {
    font-size: 16px;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: -0.02em;
    display: inline-flex;
    align-items: baseline;
    transition: letter-spacing 0.35s cubic-bezier(.22,1,.36,1);
    cursor: pointer;
  }

  .wordmark:hover {
    letter-spacing: 0.01em;
  }

  .zero {
    color: var(--yellow);
  }

  .nav-x {
    color: var(--ink);
    opacity: .55;
    display: inline-flex;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .nav-x:hover {
    opacity: 1;
    transform: translateY(-1px);
  }

  .nav-links {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
  }

  .nav-link {
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--serif);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-2);
    padding: 4px 0;
    position: relative;
    transition: color 0.15s ease;
  }

  .nav-link::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: -2px;
    height: 2px;
    background: var(--yellow);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s cubic-bezier(.22,1,.36,1);
  }

  .nav-link:hover {
    color: var(--ink);
  }

  .nav-link:hover::after {
    transform: scaleX(1);
  }

  .nav-link.active {
    color: var(--ink);
  }

  .nav-link.active::after {
    transform: scaleX(1);
  }

  /* ── HERO STUDIO ── */

  .studio-hero {
    text-align: center;
    padding-top: 44px;
    padding-bottom: 44px;
  }

  .studio-hero .label {
    margin-bottom: 20px;
  }

  .studio-hero h1 {
    font-size: clamp(30px, 8.5vw, 46px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.08;
    margin: 0 auto 20px;
    max-width: 18ch;
  }

  .studio-hero .sub {
    font-size: 15px;
    color: var(--ink-2);
    line-height: 1.7;
    margin: 0 auto;
    max-width: 560px;
  }

  .studio-hero .sub strong {
    color: var(--ink);
    font-weight: 600;
  }

  /* ── SECCIONES ── */

  .studio-products,
  .studio-exp,
  .studio-serv,
  .studio-outro {
    padding: 56px 0;
  }

.studio-products {
    border-top: 1px solid #ECECEC;
  }

  .studio-cta {
    text-align: center;
    margin-top: 34px;
  }

  .studio-products .label,
  .studio-exp .label {
    margin-bottom: 18px;
  }

  .studio-products h2,
  .studio-exp h2 {
    font-size: clamp(26px, 7vw, 38px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.12;
    margin: 0 0 14px;
  }

  .studio-products .sub,
  .studio-exp .sub {
    font-size: 15px;
    color: var(--ink-2);
    line-height: 1.65;
    margin: 0 0 34px;
    max-width: 620px;
  }

  .studio-products .sub strong,
  .studio-exp .sub strong {
    color: var(--ink);
    font-weight: 700;
  }

  /* ── GRID DE CARDS ── */

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }

  .card {
    border: 1px solid #ECECEC;
    padding: 24px 22px;
    text-align: left;
    transition:
      transform 0.3s cubic-bezier(.22,1,.36,1),
      border-color 0.3s ease,
      box-shadow 0.3s ease;
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: var(--yellow);
    box-shadow: 0 12px 26px rgba(12,12,12,.08);
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .card h3 {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }

  .tag {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 5px 8px;
    line-height: 1;
    white-space: nowrap;
  }

  .tag-live {
    background: var(--green);
    color: var(--white);
  }

  .tag-cool {
    background: var(--yellow);
    color: var(--ink);
  }

  .tag-exp {
    background: #ECECEC;
    color: var(--ink-2);
  }

  .domain {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 10px;
    position: relative;
    padding-bottom: 2px;
  }

  .domain::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: var(--yellow);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s cubic-bezier(.22,1,.36,1);
  }

  .domain:hover::after {
    transform: scaleX(1);
  }

  .domain svg {
    transition: transform 0.25s cubic-bezier(.22,1,.36,1);
  }

  .domain:hover svg {
    transform: translateX(3px);
  }

  .domain-plain {
    color: var(--ink-3);
    font-weight: 600;
  }

  .card p {
    font-size: 14px;
    color: var(--ink-2);
    line-height: 1.6;
  }

  .card .pitch {
    margin-top: 12px;
    padding-left: 10px;
    border-left: 3px solid var(--yellow);
    font-size: 12.5px;
    font-style: italic;
    color: var(--ink-3);
    line-height: 1.55;
  }

  .card.mini h3 {
    font-size: 18px;
  }

  .card.mini .card-top {
    margin-bottom: 8px;
  }

  .card.mini p {
    font-size: 14px;
  }

  /* ── LISTA DE EXPERIMENTOS ── */

  .exp-list {
    list-style: none;
    margin: 24px 0 0;
    padding: 0;
    border-top: 1px solid #ECECEC;
  }

  .exp-list li {
    display: flex;
    gap: 18px;
    padding: 14px 0;
    border-bottom: 1px solid #ECECEC;
  }

  .exp-num {
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 12px;
    font-weight: 800;
    color: var(--yellow);
    letter-spacing: 0.02em;
    padding-top: 3px;
    flex-shrink: 0;
  }

  .exp-body {
    flex: 1;
    min-width: 0;
  }

  .exp-body h3 {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  .exp-body p {
    margin-top: 3px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink-2);
  }

  /* ── FEATURED ── */

  .card.feature {
    padding: 22px;
  }

  .feat-top {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    flex-wrap: wrap;
  }

  .feat-icon {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border-radius: 10px;
    background: #14161A;
    color: #FFFFFF;
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 16px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: -0.03em;
  }

  .feat-info {
    flex: 1;
    min-width: 0;
  }

  .feat-name {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }

  .feat-tag {
    margin-top: 4px;
    font-size: 12px;
    font-weight: 600;
    color: #D97706;
    line-height: 1.4;
  }

  .feat-badge {
    flex-shrink: 0;
    background: #EDE9FE;
    color: #7C3AED;
    font-size: 11px;
    font-weight: 700;
    padding: 6px 10px;
    border-radius: 8px;
    white-space: nowrap;
  }

  .feat-chart {
    width: 100%;
    display: block;
    margin-top: 20px;
  }

  @media (max-width: 720px) {
    .feat-top {
      gap: 10px;
    }

    .feat-badge {
      width: 100%;
    }
  }

  .feat-chart text {
    font-family: var(--serif);
    fill: #9AA3B2;
    font-size: 9.5px;
    font-weight: 600;
  }

  .feat-chart .area {
    fill: #FDE68A;
  }

  .feat-chart .line {
    fill: none;
    stroke: #EAB308;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .feat-chart .gridline {
    stroke: #F1F2F5;
    stroke-width: 1;
    stroke-dasharray: 3 4;
  }

  .feat-chart .enddot {
    fill: #D97706;
    stroke: #FFFFFF;
    stroke-width: 2;
  }

  .feat-chart .dot {
    fill: #EAB308;
    opacity: 0;
  }

  .feat-chart .line {
    stroke-dasharray: 1400;
    stroke-dashoffset: 1400;
    transition:
      stroke-dashoffset 1.5s cubic-bezier(.22,1,.36,1) .2s;
  }

  .feat-chart .area {
    transform: scaleY(0);
    transform-origin: bottom;
    transform-box: fill-box;
    transition:
      transform 1.2s cubic-bezier(.22,1,.36,1) .45s;
  }

  .feat-chart .enddot {
    transform: scale(0);
    transform-origin: center;
    transform-box: fill-box;
    transition:
      transform .45s cubic-bezier(.22,1,.36,1) 1.3s;
  }

  .card.feature.is-in .feat-chart .line {
    stroke-dashoffset: 0;
  }

  .card.feature.is-in .feat-chart .area {
    transform: scaleY(1);
  }

  .card.feature.is-in .feat-chart .enddot {
    transform: scale(1);
  }

  .card.feature.is-in .feat-chart .dot {
    opacity: 1;
    transition: opacity .35s ease var(--i, 0s);
  }

  /* ── INDICADOR LIVE ── */

  .live {
    position: relative;
    display: inline-block;
    width: 8px;
    height: 8px;
    margin-right: 7px;
    border-radius: 50%;
    background: var(--green, #12B76A);
    flex-shrink: 0;
    vertical-align: 0.1em;
  }

  .live::after {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 2px solid var(--green, #12B76A);
    opacity: 0;
    animation: livePing 2.4s cubic-bezier(.22,1,.36,1) infinite;
  }

  .feat-badge .live {
    width: 6px;
    height: 6px;
    margin-right: 6px;
    vertical-align: 0.05em;
  }

  .feat-badge .live::after {
    inset: -3px;
    border-width: 1.5px;
  }

  @keyframes livePing {
    0% {
      transform: scale(.55);
      opacity: .9;
    }

    60%, 100% {
      transform: scale(1.65);
      opacity: 0;
    }
  }

  /* ── PROYECTO ETAPAS TEMPRANAS ── */

  .studio-early {
    padding: 64px 0 0;
  }

  .studio-early .label {
    margin-bottom: 26px;
  }

  .early-card {
    margin-top: 10px;
    border: 1px dashed #C9C4B8;
    border-radius: 14px;
    background: #F6F4EF;
    padding: 26px 22px;
    max-width: 760px;
  }

  .early-top {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .early-mark {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    border-radius: 12px;
    background: #E4E1D8;
    color: #0C0C0C;
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 18px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .early-head h3 {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .early-role {
    margin-top: 3px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-2);
  }

  .early-desc {
    margin-top: 16px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink-2);
  }

  .early-tag {
    display: inline-block;
    margin-top: 18px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-3);
    border: 1px solid #D8D3C8;
    padding: 6px 12px;
    border-radius: 999px;
  }

  /* ── MOVIMIENTO REDUCIDO ── */

  @media (prefers-reduced-motion: reduce) {
    .reveal,
    .reveal.is-in {
      opacity: 1;
      transform: none;
      transition: none;
    }

    .feat-chart .dot {
      opacity: 1;
      transition: none;
    }

    .feat-chart .line {
      stroke-dashoffset: 0;
      transition: none;
    }

    .feat-chart .area {
      transform: none;
      transition: none;
    }

    .feat-chart .enddot {
      transform: none;
      transition: none;
    }

    .live::after {
      animation: none;
      opacity: 0;
    }
  }

  /* ── EMBEDS DE X ── */

  .tweet-embed {
    width: 100%;
    max-width: 550px;
    margin: 24px auto 0;
    overflow: hidden;
  }

  .tweet-embed .twitter-tweet {
    max-width: 100%;
    margin: 0 auto;
  }

  .tweet-embed iframe {
    max-width: 100%;
    display: block;
  }

  .tweet-embed + .sub {
    margin-top: 26px;
  }

  .tweet-note {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 26px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-2);
  }

  .tweet-note::before {
    content: '';
    width: 7px;
    height: 7px;
    background: var(--yellow);
    flex-shrink: 0;
  }

  /* ── OUTRO ── */

  .studio-outro {
    text-align: center;
    border-top: 1px solid #ECECEC;
  }

  .studio-outro h2 {
    font-size: clamp(26px, 7vw, 40px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.12;
    margin: 0 auto 16px;
    max-width: 720px;
  }

  .studio-outro p {
    font-size: 15px;
    color: var(--ink-2);
    line-height: 1.7;
    margin: 0 auto 30px;
    max-width: 520px;
  }

  .studio-outro p strong {
    color: var(--ink);
    font-weight: 700;
  }

  /* Botón gigante */

  .btn-main {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    max-width: 420px;
    background: var(--yellow);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 700;
    padding: 17px 28px;
    border-radius: 0;
    border: none;
    cursor: pointer;
    line-height: 1;
    transition:
      background 0.25s ease,
      color 0.25s ease,
      transform 0.12s ease;
  }

  .btn-main svg.arr {
    transition:
      transform 0.25s cubic-bezier(.22,1,.36,1),
      fill 0.25s ease;
  }

  .btn-main:hover {
    background: var(--ink);
    color: var(--white);
  }

  .btn-main:hover svg.arr {
    transform: translateX(5px);
    fill: var(--yellow);
  }

  .btn-main:active {
    transform: scale(.98);
  }

  /* ── FOOTER ── */

  footer {
    padding: 36px 0 40px;
  }

  .footer-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 14px;
  }

  .footer-brand {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .footer-links {
    display: flex;
    gap: 22px;
    align-items: center;
  }

  .footer-links a {
    font-size: 12.5px;
    color: var(--ink-3);
    transition: color 0.15s ease;
  }

  .footer-links a:hover {
    color: var(--ink);
  }

  .footer-x {
    color: var(--ink-3);
    display: inline-flex;
    transition:
      color 0.15s ease,
      transform 0.15s ease;
  }

  .footer-x:hover {
    color: var(--ink);
    transform: translateY(-1px);
  }

  .footer-copy {
    font-size: 12px;
    color: var(--ink-3);
  }

  /* ── REVEAL ── */

  .reveal {
    opacity: 0;
    transform: translateY(18px);
    transition:
      opacity 0.6s cubic-bezier(.22,1,.36,1),
      transform 0.6s cubic-bezier(.22,1,.36,1);
  }

  .reveal.is-in {
    opacity: 1;
    transform: translateY(0);
  }

  .d1 {
    transition-delay: 0.08s;
  }

  .d2 {
    transition-delay: 0.18s;
  }

  .d3 {
    transition-delay: 0.28s;
  }

  .d4 {
    transition-delay: 0.38s;
  }

  /* ================================================================
     AJUSTES MÓVIL (≤720px)
     ================================================================ */

  @media (max-width: 720px) {
    .nav-link {
      padding: 8px 0;
    }

    .nav-links {
      gap: 18px;
    }

    .card,
    .card.feature {
      padding: 20px 18px;
    }

    .feat-chart {
      margin-top: 16px;
    }

    .tweet-embed {
      margin-top: 20px;
    }

    .tweet-note {
      margin-top: 22px;
    }
  }

  /* ================================================================
     BREAKPOINT ≥ 721px
     ================================================================ */

  @media (min-width: 721px) {
    .container {
      padding: 0 clamp(22px, 5vw, 48px);
    }

    nav {
      height: 68px;
      min-height: 68px;
      padding: 0 clamp(22px, 5vw, 48px);
    }

    .wordmark {
      font-size: 18px;
    }

    .nav-links {
      display: flex;
      gap: 26px;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .nav-link {
      font-size: 13.5px;
    }

    .studio-hero {
      padding-top: clamp(44px, 6vw, 84px);
      padding-bottom: clamp(44px, 6vw, 84px);
    }

<script>

  /* ── Reveal on scroll ── */

  const revealObserver = new IntersectionObserver((entries) => {

    entries.forEach(entry => {

      if (entry.isIntersecting) {

        entry.target.classList.add('is-in');

        revealObserver.unobserve(entry.target);

      }

    });

  }, {
    threshold: 0.12
  });


  document
    .querySelectorAll('.reveal')
    .forEach(el => revealObserver.observe(el));

</script>
